# ClickHouse for Virtual Analyst.
#
# One container. Inside it live TWO databases, mirroring the split the production
# system has across two servers:
#   - `lake`     -> the raw mzML data (scans, spectra_points, chromatogram_points)
#   - `analysis` -> the XICs produced by each run (processing_sampleparameter)
# Both are created by `py -m app.db.schema`, not by compose: CLICKHOUSE_DB only
# creates one, and creating them in code keeps the schema and the DDL together.

services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.7.3.13
    container_name: va_flask_clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: va
      CLICKHOUSE_PASSWORD: va
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
      TZ: America/Sao_Paulo
    ports:
      # 8124/9001 on the HOST, not 8123/9000: the machine this was built on
      # already ran another ClickHouse on the default ports. The two coexist;
      # inside the container the ports are the usual ones.
      - "8124:8123"   # HTTP - this is the one clickhouse_connect uses
      - "9001:9000"   # native
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./docker/clickhouse/memory.xml:/etc/clickhouse-server/config.d/memory.xml:ro
    ulimits:
      # ClickHouse opens a lot of files for the MergeTree; the Docker default
      # (1024) kills a large spectra_points insert.
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  clickhouse_data:
